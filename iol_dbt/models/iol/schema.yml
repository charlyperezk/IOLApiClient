version: 2

models:
  - name: stg_iol_portfolio_raw
    description: "Raw snapshots staged for downstream models."
    columns:
      - name: snapshot_id
        tests:
          - not_null

  - name: fct_iol_portfolio_assets
    description: "Flattened portfolio assets per snapshot."
    columns:
      - name: snapshot_id
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null

  - name: mart_iol_portfolio_daily
    description: "Daily portfolio summary from latest snapshot per day."
    columns:
      - name: report_date
        tests:
          - not_null

  - name: mart_iol_portfolio_intraday_high
    description: "Highest portfolio valuation per day with timestamp."
    columns:
      - name: report_date
        tests:
          - not_null
      - name: high_at
        tests:
          - not_null

  - name: mart_iol_asset_highs
    description: "All-time high valuation per symbol and latest current valuation."
    columns:
      - name: symbol
        tests:
          - not_null

  - name: mart_iol_asset_daily_allocation
    description: "Daily participation of each asset in total portfolio value."
    columns:
      - name: report_date
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: daily_variation
